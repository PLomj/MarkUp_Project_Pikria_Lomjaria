<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spotify Home</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/navigation.css">
  <link rel="stylesheet" href="styles/sidebar.css">
</head>
<body class="desktop-home">
  <header class="top-bar">
    <nav class="primary-navigation" aria-label="Primary">
      <ul class="primary-navigation__list">
        <li class="primary-navigation__slot primary-navigation__slot--library">
          <span class="primary-navigation__item">
            <img class="top-bar__icon" src="assets/icons/library.svg" alt="">
            My Library
          </span>
        </li>
        <li class="primary-navigation__slot primary-navigation__slot--home">
          <a class="primary-navigation__item" href="./index.html" aria-current="page">
            <img class="top-bar__icon" src="assets/icons/home-filled.svg" alt="">
            Home
          </a>
        </li>
        <li class="primary-navigation__slot">
          <span class="primary-navigation__item">
            <img class="top-bar__icon" src="assets/icons/discover.svg" alt="">
            Discover
          </span>
        </li>
        <li class="primary-navigation__slot primary-navigation__slot--search">
          <span class="primary-navigation__item">
            <img class="top-bar__icon" src="assets/icons/search.svg" alt="">
            Search
          </span>
        </li>
      </ul>
    </nav>

    <div class="top-bar__utilities" aria-hidden="true">
      <img class="top-bar__icon" src="assets/icons/notifications.svg" alt="">
      <img class="top-bar__icon" src="assets/icons/open-lock.svg" alt="">
      <img class="top-bar__icon" src="assets/icons/friends.svg" alt="">
      <img class="top-bar__icon" src="assets/icons/settings.svg" alt="">
      <img class="top-bar__avatar" src="assets/images/profile-avatar.png" alt="">
    </div>
  </header>

  <nav class="library" aria-label="Your Library">
    <ul class="library__list">
      <li class="library__row">
        <img class="library__icon" src="assets/icons/pin.svg" alt="">
        Pins
        <img class="library__icon library__icon--end" src="assets/icons/chevron-right.svg" alt="">
      </li>
      <li class="library__row">
        <img class="library__icon" src="assets/icons/playlist.svg" alt="">
        Playlists
        <img class="library__icon library__icon--end" src="assets/icons/chevron-right.svg" alt="">
      </li>
      <li class="library__row">
        <img class="library__icon" src="assets/icons/heart.svg" alt="">
        Liked songs
      </li>
      <li class="library__row">
        <img class="library__icon" src="assets/icons/save.svg" alt="">
        Saves
      </li>
      <li class="library__row">
        <img class="library__icon" src="assets/icons/album.svg" alt="">
        Albums
      </li>
      <li class="library__row">
        <img class="library__icon" src="assets/icons/folder.svg" alt="">
        Folders
      </li>
      <li class="library__row">
        <img class="library__icon" src="assets/icons/podcast.svg" alt="">
        Podcasts
      </li>
      <li class="library__row">
        <img class="library__icon" src="assets/icons/audiobook.svg" alt="">
        Audiobooks
      </li>
      <li class="library__row">
        <img class="library__icon" src="assets/icons/artist.svg" alt="">
        Artists
      </li>
    </ul>
  </nav>

  <main class="home-content">
    <h1>Spotify Home</h1>
  </main>

  <section class="player" aria-label="Player">Bottom player</section>
</body>
</html>
